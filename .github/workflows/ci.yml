name: Jobiew checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Homepage JS DOM contract (synthetic)
        run: node --test tests/homepage_frontend_v219.test.mjs
      - name: Syntax and offline regression
        run: |
          python -m compileall -q backend crawler scripts
          python -m unittest discover -s tests -v
          (cd backend && python -m unittest criteria_v2.test_checkpoint_contract_v218 criteria_v2.test_checkpoint_archive_v218 criteria_v2.test_checkpoint_sampling_v218 criteria_v2.test_checkpoint_cumulative_v221 -v)
          (cd crawler && python -m unittest discover -s tests -v)
      - name: Django local SQLite schema and smoke
        env:
          DJANGO_DEBUG: '1'
          WI_DB_ENGINE: sqlite
          DJANGO_SECRET_KEY: jobiew-ci-test-only-secret
        run: |
          cd backend
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test companies.test_company_ui_v23 companies.test_public_map_v24 companies.test_homepage_preview_v219 companies.test_homepage_public_v220 assessments.test_five_criteria_contract_v6 criteria_v2 --noinput -v 1

  postgres-synthetic:
    name: Private checkpoint PostgreSQL concurrency (synthetic only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobiew_ci
          POSTGRES_USER: jobiew_ci
          POSTGRES_PASSWORD: ci-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobiew_ci -d jobiew_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: synthetic-ci-only-never-use-in-production
      WI_DB_ENGINE: postgresql
      WI_DB_NAME: jobiew_ci
      WI_DB_USER: jobiew_ci
      WI_DB_PASSWORD: ci-only-not-production
      WI_DB_HOST: 127.0.0.1
      WI_DB_PORT: '5432'
      JOBIEW_DUAL6_PUBLICATION_ENABLED: '0'
      JOBIEW_DUAL6_PAID_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Django and PostgreSQL client dependencies
        run: pip install -r backend/requirements.txt
      - name: Test private staging and concurrent idempotency on PostgreSQL
        run: |
          cd backend
          python manage.py check
          python manage.py test criteria_v2.test_checkpoint_stage_db_v218 criteria_v2.test_checkpoint_cumulative_db_v221 criteria_v2.test_checkpoint_bulk_review_v222 criteria_v2.test_checkpoint_private_prod_v224 companies.test_homepage_preview_v219 companies.test_homepage_public_v220 --noinput -v 2
