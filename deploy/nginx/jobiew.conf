# Replace jobiew.example.com with the real hostname before enabling.
# This HTTP-only bootstrap config MUST be upgraded to HTTPS via Certbot before public launch.
server {
    listen 80;
    server_name jobiew.example.com;
    client_max_body_size 10m;
    location /static/ {
        alias /var/www/jobiew/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }
}
